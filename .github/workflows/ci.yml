name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Secret scan
        run: python scripts/scan_secrets.py

      - name: Tests
        run: python -m pytest

      - name: Demo reproducibility
        run: |
          python scripts/build_demo.py
          python scripts/build_examples.py
          git diff --exit-code -- datasets examples \
            || (echo "::error::datasets/ or examples/ changed — run scripts/build_demo.py + scripts/build_examples.py and commit" && exit 1)
